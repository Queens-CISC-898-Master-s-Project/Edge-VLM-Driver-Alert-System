name: CI

on:
  push:
    branches:
      - main
      - dev
      - jetson

  pull_request:
    branches:
      - main
      - dev
      - jetson

jobs:
  python-check:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Check Python syntax
        run: |
          python -m compileall -q src tests

  docker-dev:
    name: Build development Docker image
    if: github.ref == 'refs/heads/dev' || github.base_ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build development image
        run: |
          docker build \
            -f docker/Dockerfile.dev \
            -t edgevlm-drive-dev:ci \
            .

  docker-jetson:
    name: Validate Jetson Dockerfile
    if: github.ref == 'refs/heads/jetson' || github.base_ref == 'jetson'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Jetson Dockerfile
        run: |
          test -f docker/Dockerfile.jetson

      - name: Validate Jetson Dockerfile syntax
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f docker/Dockerfile.jetson \
            --load \
            -t edgevlm-drive-jetson:ci \
            .